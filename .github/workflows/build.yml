name: Build SR Client

# Every push builds the client. main publishes a GitHub Release per version;
# the dev branch also builds the developer client and refreshes the
# "SR Client Dev" pre-release.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC linker
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Odin dev-2026-10
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing "https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-windows-amd64-dev-2026-10.zip" -OutFile odin.zip
          Expand-Archive odin.zip -DestinationPath odin-dist
          $odin = (Get-ChildItem -Recurse odin-dist -Filter odin.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $odin
          Remove-Item odin.zip

      - name: Install the Vulkan SDK (glslc compiles the shaders to SPIR-V)
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--root", "C:\VulkanSDK", "--accept-licenses", "--default-answer", "--confirm-command", "install"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\Bin"
          Remove-Item vulkan-sdk.exe

      - name: Build
        shell: cmd
        run: build.bat all

      - name: Build developer client (dev branch)
        if: github.ref == 'refs/heads/dev'
        shell: cmd
        run: build.bat dev

      - name: Get game files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the copy in the repo (game-files/), else a release tagged 'game-files'.
          if (Test-Path game-files\sr-game-files.zip) {
            New-Item -ItemType Directory gf | Out-Null
            Copy-Item game-files\sr-game-files.zip gf\
          } else {
            gh release download game-files --repo "${{ github.repository }}" --pattern "sr-game-files.zip" --dir gf
            if ($LASTEXITCODE -ne 0) { throw "Game files missing: add game-files/sr-game-files.zip or a 'game-files' release (see README)." }
          }
          Expand-Archive gf\sr-game-files.zip -DestinationPath gf

      - name: Stage
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory stage | Out-Null
          # 1) Krunker game files (models, textures, sounds) from the pack
          Copy-Item -Recurse gf\sr-game-files\* stage\
          # 2) This repo's files win: maps, shaders, configs, lighting configs
          Copy-Item -Recurse -Force assets\* stage\assets\
          Copy-Item -Recurse -Force krunker-configs\* stage\krunker-configs\
          # 3) Binaries
          Copy-Item bin\sr_client.exe, bin\sr_server.exe, bin\sr_browser.exe, bin\WebView2Loader.dll, bin\WebView2-LICENSE.txt, bin\WebView2-NOTICE.txt, VERSION stage\
          "version=$version" >> $env:GITHUB_ENV

      - name: Installer + portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:version" "/DStageDir=..\stage" installer\sr-client.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Compress-Archive -Path stage\* -DestinationPath "dist\SR-Client-Portable-$env:version.zip"
          Get-ChildItem dist

      - name: Developer zip (dev branch)
        if: github.ref == 'refs/heads/dev'
        shell: pwsh
        run: |
          # The full portable folder plus sr_client_dev.exe (F3 debug window,
          # hitboxes, shot rays, tester export). Run sr_client_dev.exe from it.
          Copy-Item -Recurse stage stage-dev
          Copy-Item bin\sr_client_dev.exe stage-dev\
          Compress-Archive -Path stage-dev\* -DestinationPath "dist\SR-Client-Dev-$env:version.zip"

      - name: Release notes for this version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG.md from "## SR Client <version>" down to the section of
          # the last published release, so a release lists every change since.
          $last = (gh release list --repo "${{ github.repository }}" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName') -replace '^v',''
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -eq "## SR Client ${{ env.version }}") { $start = $i; break } }
          if ($start -lt 0) { "SR Client ${{ env.version }}" | Set-Content release-notes.md; exit 0 }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## ") -and ($last -eq "" -or $last -eq "${{ env.version }}" -or $lines[$i] -eq "## SR Client $last")) { $end = $i; break }
          }
          $lines[$start..($end - 1)] | Set-Content release-notes.md

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SR-Client-${{ env.version }}-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the release was made on the website or only the tag was pushed.
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" (Get-ChildItem dist\* -Exclude 'SR-Client-Dev-*').FullName --clobber --repo "${{ github.repository }}"
          } else {
            gh release create "${{ github.ref_name }}" (Get-ChildItem dist\* -Exclude 'SR-Client-Dev-*').FullName --repo "${{ github.repository }}" --title "SR Client ${{ github.ref_name }}" --notes-file release-notes.md
          }

      # Every version on main gets its own GitHub Release v<VERSION>.
      - name: Publish release for this version (main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ env.version }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist\* -Exclude 'SR-Client-Dev-*').FullName --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag (Get-ChildItem dist\* -Exclude 'SR-Client-Dev-*').FullName --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "SR Client $tag" --notes-file release-notes.md
          }


      # The dev branch keeps one pre-release, "SR Client Dev", with the newest
      # developer zip (replaced on every push). It never touches main's releases.
      - name: Publish Dev pre-release (dev branch)
        if: github.ref == 'refs/heads/dev'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-latest"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag --repo "${{ github.repository }}" }
          "Developer build of SR Client ${{ env.version }} from the dev branch (${{ github.sha }}). For testers; see the Dev build section of the README." | Set-Content dev-notes.md
          gh release create $tag (Get-ChildItem dist\SR-Client-Dev-*).FullName --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "SR Client Dev (${{ env.version }})" --notes-file dev-notes.md
